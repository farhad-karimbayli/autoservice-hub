name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/autoservicehub-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/autoservicehub-frontend

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend
        run: dotnet restore backend/AutoServicehub.sln

      - name: Build backend
        run: dotnet build backend/AutoServicehub.sln --configuration Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/AutoServiceHub.Api/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    name: Deploy to AWS Linux VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            mkdir -p "${{ secrets.AWS_APP_DIR }}"

      - name: Upload production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ secrets.AWS_APP_DIR }}

      - name: Pull and restart containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          envs: AWS_APP_DIR,AWS_HOST,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG,JWT_KEY,MSSQL_SA_PASSWORD,PUBLIC_URL
          script: |
            set -eu

            PUBLIC_URL="${PUBLIC_URL:-http://${AWS_HOST}}"

            cd "${AWS_APP_DIR}"

            cat > .env <<ENV_FILE
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
            IMAGE_TAG=${IMAGE_TAG}
            MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
            JWT_KEY=${JWT_KEY}
            PUBLIC_URL=${PUBLIC_URL}
            ENV_FILE

            echo "${DOCKERHUB_TOKEN}" | docker login --username "${DOCKERHUB_USERNAME}" --password-stdin

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            ${COMPOSE} -f docker-compose.prod.yml pull
            ${COMPOSE} -f docker-compose.prod.yml up -d
            docker image prune -f
